name: Deploy to VPS

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Desplegar en VPS
    runs-on: ubuntu-latest

    steps:
      - name: Conectar al VPS y actualizar
        uses: appleboy/ssh-action@v1.2.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          envs: GITHUB_TOKEN
          script_stop: true
          command_timeout: 15m
          script: |
            set -e
            cd "${{ secrets.VPS_PATH }}"
            git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/emirlucas75-star/boli.git"
            git fetch origin main
            git reset --hard origin/main
            git remote set-url origin "https://github.com/emirlucas75-star/boli.git"
            bash scripts/deploy.sh
